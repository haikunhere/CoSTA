defaults:
  - ppo_trainer
  - _self_
hydra:
  searchpath: [pkg://verl.trainer.config]
  run:
    dir: ${oc.env:COSTA_RL_OUTPUT}/hydra
actor_rollout_ref:
  model:
    path: ${oc.env:COSTA_RL_MODEL}
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 1
    ppo_epochs: 1
    shuffle: false
    use_dynamic_bsz: true
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 32768
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    policy_loss:
      loss_mode: vanilla
    entropy_coeff: 0.0
    calculate_entropy: false
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    loss_agg_mode: token-mean
    fsdp_config:
      strategy: fsdp2
      model_dtype: fp32
      param_offload: false
      optimizer_offload: false
      use_torch_compile: false
      reshard_after_forward: false
      forward_prefetch: true
      seed: 42
    optim:
      lr: 1.5e-6
      lr_scheduler_type: constant
      lr_warmup_steps: 0
      lr_warmup_steps_ratio: 0.0
      total_training_steps: -1
      betas: [0.9, 0.999]
      weight_decay: 0.01
      clip_grad: 1.0
    checkpoint:
      save_contents: [model, optimizer, extra, hf_model]
      load_contents: [model, optimizer, extra]
  ref:
    use_torch_compile: false
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 32768
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      model_dtype: fp32
      param_offload: false
      use_torch_compile: false
  rollout:
    name: sglang
    mode: async
    skip_tokenizer_init: false
    n: 1
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    pipeline_model_parallel_size: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    prompt_length: 28672
    response_length: 4096
    max_model_len: 32768
    max_num_seqs: 48
    gpu_memory_utilization: 0.65
    free_cache_engine: true
    calculate_log_probs: true
    engine_kwargs:
      sglang:
        random_seed: 42
        enable_deterministic_inference: true
        rl_on_policy_target: fsdp
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 32768
    log_prob_micro_batch_size_per_gpu: 1
    checkpoint_engine:
      backend: naive
algorithm:
  adv_estimator: rloo
  use_kl_in_reward: false
trainer:
  nnodes: 1
  n_gpus_per_node: 4
  default_local_dir: ${oc.env:COSTA_RL_OUTPUT}/checkpoints
costa:
  seed: 42
  total_batches: null
  checkpoint_interval: 20
  questions_per_batch: null
  questions_per_mini: null
  teams_per_question: null
  context: 32768
  coordinator_tokens: 2048
  worker_tokens: 2048
  shared_worker_tokens: 2048
  worker_calls: 6
  delegation_turns: 3
  window_size: 15
  top_k: 15
